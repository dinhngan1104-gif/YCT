<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TỔNG ÔN ĐỌC – VIẾT · 14 bài · Easy Steps to Chinese for Kids 1a + 1b</title>
<style>
:root{
  --sky1:#cfe9ff; --sky2:#eef7ff; --sky3:#fff8ec;
  --pink:#ffb3c7; --pink-d:#ff7fa3; --yellow:#ffe07a; --yellow-d:#ffc93c;
  --mint:#a8e6cf; --mint-d:#4ec99b; --blue:#a6d8ff; --blue-d:#3d9bf0;
  --purple:#d7c3f5; --purple-d:#9d72dd; --orange:#ffcba4; --orange-d:#ff9a4d;
  --ink:#38305a; --ink2:#6f6494; --good:#2fbe80; --bad:#ff6b6b; --r:22px;
  --sh:0 6px 0 rgba(0,0,0,.08), 0 12px 24px rgba(90,70,140,.15);
  --sh-s:0 3px 0 rgba(0,0,0,.07), 0 6px 14px rgba(90,70,140,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Baloo 2","Comic Sans MS","Segoe UI Rounded","Nunito","PingFang SC",
  "Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:var(--ink);font-size:18px;
  min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,var(--sky3) 100%)}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
.zh{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","SimHei",sans-serif;letter-spacing:.03em}
.py{font-family:"Segoe UI","Nunito",system-ui,sans-serif;color:var(--ink2);font-weight:700}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
#app{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:10px 14px 80px}
#hud{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:9px 12px;margin-bottom:12px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-radius:20px;box-shadow:var(--sh-s)}
.chip{display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;
  padding:5px 13px;font-weight:800;font-size:15px;box-shadow:var(--sh-s)}
.chip b{font-size:18px}
.chip.sc{background:linear-gradient(135deg,var(--yellow),#fff3c4)}
.chip.rd{background:linear-gradient(135deg,var(--blue),#dcefff)}
.chip.wr{background:linear-gradient(135deg,var(--mint),#dff7ec)}
#hud .sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;background:#fff;font-size:20px;
  box-shadow:var(--sh-s);display:grid;place-items:center}
.ib.off{opacity:.4}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px 18px;
  margin-bottom:16px;animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:10px 8px 2px}
.hero h1{font-size:clamp(20px,4.2vw,31px);margin:6px 0 4px}
.hero p{margin:4px 0;color:var(--ink2);font-weight:700}
.mascot{font-size:62px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-11px) rotate(3deg)}}
.tip{background:#fffdf1;border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh-s);
  font-weight:700;color:var(--ink2);font-size:15px;margin-bottom:14px}
.qhead{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap;
  font-weight:800;color:var(--ink2);font-size:14px}
.tag{background:var(--purple);color:#4a3170;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800}
.tag.g{background:var(--mint)}.tag.y{background:var(--yellow)}.tag.b{background:var(--blue)}.tag.o{background:var(--orange)}
.instr{font-size:16px;color:var(--ink2);font-weight:700;margin:2px 0 14px}
.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.zone{border-radius:22px;box-shadow:var(--sh);padding:20px 16px;text-align:center;
  border:3px solid transparent;transition:.16s}
.zone:hover{transform:translateY(-4px);border-color:var(--purple-d)}
.zone .ze{font-size:52px;line-height:1.1}
.zone .zn{font-weight:900;font-size:20px;margin-top:4px}
.zone .zd{font-size:14px;color:var(--ink2);font-weight:700;margin-top:4px}
.zone.a{background:linear-gradient(160deg,#e8f4ff,#fff)}
.zone.b{background:linear-gradient(160deg,#fff3e3,#fff)}
.zone.c{background:linear-gradient(160deg,#eafaf2,#fff)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}
.lcard{background:linear-gradient(180deg,#fff,#f6fbff);border-radius:18px;box-shadow:var(--sh-s);
  padding:12px 10px;text-align:left;border:3px solid transparent;transition:.15s}
.lcard:hover{transform:translateY(-3px);border-color:var(--blue)}
.lcard .lb{font-size:12px;font-weight:900;color:var(--purple-d)}
.lcard .lt{font-size:20px;font-weight:800;margin:2px 0}
.lcard .lv{font-size:13px;color:var(--ink2);font-weight:700}
.lcard .lp{margin-top:7px;height:8px;background:#eef1f7;border-radius:999px;overflow:hidden}
.lcard .lp i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--mint-d),var(--yellow-d))}
#tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#fff;border-radius:999px;padding:8px 15px;font-weight:800;font-size:15px;
  box-shadow:var(--sh-s);color:var(--ink2)}
.tab.on{background:linear-gradient(135deg,var(--purple),#efe6ff);color:#4a3170;transform:translateY(-2px)}
.big{font-size:clamp(30px,6vw,54px);font-weight:800;line-height:1.4;text-align:center;margin:6px 0 2px}
.mid{font-size:clamp(19px,3.3vw,26px);font-weight:800;line-height:1.55;text-align:center}
.pyline{text-align:center;font-size:clamp(15px,2.4vw,19px);margin:0 0 6px}
.viline{text-align:center;font-size:15px;color:var(--ink2);font-weight:700;margin-bottom:8px}
.center{text-align:center;margin:8px 0}
.opts{display:grid;gap:11px;margin-top:12px}
.opts.c1{grid-template-columns:1fr}
.opts.c2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.c3{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{background:#fff;border:3px solid #e6ecf5;border-radius:18px;padding:14px 12px;
  font-size:22px;font-weight:800;box-shadow:var(--sh-s);transition:.15s;color:var(--ink)}
.opt:hover{transform:translateY(-3px);border-color:var(--blue-d)}
.opt.sm{font-size:18px}
.opt.hz{font-size:54px;padding:16px 8px;line-height:1.1}
.opt.ok{background:#e5fbf1;border-color:var(--good)}
.opt.no{background:#ffeaea;border-color:var(--bad)}
.opt .sub{display:block;font-size:13px;color:var(--ink2);font-weight:700;margin-top:4px}
.speaker{background:linear-gradient(135deg,var(--blue),#d9edff);border-radius:999px;
  padding:12px 24px;font-size:19px;font-weight:800;box-shadow:var(--sh-s);margin:4px 5px}
.speaker.slow{background:linear-gradient(135deg,var(--mint),#dff7ec);font-size:17px;padding:10px 18px}
.btn{border-radius:999px;padding:12px 22px;font-size:17px;font-weight:800;box-shadow:var(--sh-s);
  background:#fff;transition:.15s;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:linear-gradient(135deg,var(--pink),#ffd9e3)}
.btn.g{background:linear-gradient(135deg,var(--mint),#dff7ec)}
.btn.y{background:linear-gradient(135deg,var(--yellow),#fff3c4)}
.btn.b{background:linear-gradient(135deg,var(--blue),#dcefff)}
.btn.ghost{background:#f3f5fa;color:var(--ink2)}
.btn.sm{padding:7px 14px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.sit{background:linear-gradient(135deg,#fff6e5,#fffdf6);border-radius:18px;padding:16px;
  box-shadow:var(--sh-s);font-size:19px;font-weight:800;text-align:center;margin-bottom:6px}
.sit .em{font-size:46px;display:block;line-height:1.2;margin-bottom:4px}
.mic{width:96px;height:96px;border-radius:50%;font-size:40px;margin:10px auto;display:grid;
  place-items:center;background:linear-gradient(135deg,var(--pink),#ffd9e3);box-shadow:var(--sh)}
.mic.rec{animation:rc .8s infinite alternate}
@keyframes rc{to{box-shadow:0 0 0 16px rgba(255,127,163,.22)}}
.heard{text-align:center;font-size:17px;font-weight:800;min-height:24px;margin-top:4px}
.panelimg{width:100%;max-width:700px;border-radius:16px;box-shadow:var(--sh-s);display:block;
  margin:0 auto 14px;background:#fff;cursor:zoom-in}
.panelimg.zoom{position:fixed;inset:12px;z-index:70;width:auto;height:auto;
  max-width:calc(100% - 24px);max-height:calc(100% - 24px);margin:auto;object-fit:contain}
/* ---- ô viết chữ 田字格 ---- */
.wwrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.tian{position:relative;width:250px;height:250px;border-radius:14px;box-shadow:var(--sh-s);
  background:#fff;touch-action:none}
.tian canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:14px}
.tian .guidech{position:absolute;inset:0;display:grid;place-items:center;
  font-size:77%;line-height:1;color:#dde5f1;pointer-events:none;user-select:none;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","SimHei",sans-serif}
.tian .guidech span{font-size:192px}
.tian.noguide .guidech{display:none}
.tian .grid{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to right,transparent calc(50% - 1px),#ffc9d6 calc(50% - 1px),#ffc9d6 calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(to bottom,transparent calc(50% - 1px),#ffc9d6 calc(50% - 1px),#ffc9d6 calc(50% + 1px),transparent calc(50% + 1px));
  border:3px solid #ff9fb5;border-radius:14px}
.wmeta{min-width:190px;max-width:280px}
.wmeta .wh{font-size:44px;font-weight:800;line-height:1.1}
.wmeta .wp{font-size:17px}
.wmeta .wv{font-size:15px;color:var(--ink2);font-weight:700}
.sbar{height:14px;background:#eef1f7;border-radius:999px;overflow:hidden;max-width:280px;margin:10px auto}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36b,var(--good));transition:.4s}
.chars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.cbtn{background:#fff;border:3px solid #e6ecf5;border-radius:14px;padding:6px 13px;
  font-size:26px;font-weight:800;box-shadow:var(--sh-s)}
.cbtn.on{border-color:var(--purple-d);background:#f6efff}
.cbtn.done{border-color:var(--good);background:#eafaf2}
/* ---- ghép câu ---- */
.slot{min-height:74px;background:#f6f8fc;border:3px dashed #cdd8e8;border-radius:16px;
  padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.chip2{background:#fff;border:3px solid #e6ecf5;border-radius:14px;padding:10px 15px;font-size:26px;
  font-weight:800;box-shadow:var(--sh-s)}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
/* ---- games ---- */
.gmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{background:linear-gradient(160deg,#fff,#f3f9ff);border-radius:20px;box-shadow:var(--sh);
  padding:16px 12px;text-align:center;border:3px solid transparent;transition:.16s}
.gcard:hover{transform:translateY(-4px);border-color:var(--purple-d)}
.gcard .ge{font-size:42px;line-height:1.1}
.gcard .gn{font-weight:900;font-size:17px;margin-top:4px}
.gcard .gd{font-size:13px;color:var(--ink2);font-weight:700;margin-top:3px}
.gcard .gs{font-size:13px;font-weight:800;color:var(--good);margin-top:5px}
.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px;margin-top:12px}
.cell{background:linear-gradient(160deg,#fff,#eef6ff);border:3px solid #e6ecf5;border-radius:16px;
  padding:14px 4px;font-size:28px;box-shadow:var(--sh-s);transition:.12s;min-height:74px}
.cell.sm{font-size:16px;font-weight:800}
.cell.hz{font-size:34px;font-weight:800}
.cell.gone{opacity:.22;pointer-events:none;border-color:var(--good)}
.gtimer{text-align:center;font-size:22px;font-weight:900}
.sky{position:relative;height:320px;background:linear-gradient(180deg,#d8efff,#f2fbff);
  border-radius:18px;overflow:hidden;margin-top:10px}
.bal{position:absolute;width:80px;height:96px;border-radius:50% 50% 46% 46%;
  display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,.25);animation:float 3.4s ease-in-out infinite;cursor:pointer}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bal.pop{animation:popout .35s forwards}
@keyframes popout{to{transform:scale(1.6);opacity:0}}
.ladder{display:flex;flex-direction:column-reverse;gap:6px;margin:10px auto;max-width:320px}
.step{background:#f3f7ff;border:3px solid #e0e9f7;border-radius:12px;padding:9px;text-align:center;
  font-weight:800;font-size:17px}
.step.on{background:linear-gradient(135deg,var(--yellow),#fff3c4);border-color:var(--yellow-d)}
.step.done{background:#eafaf2;border-color:var(--good)}
#fb{position:fixed;inset:0;background:rgba(40,30,70,.44);display:none;place-items:center;z-index:80;padding:16px}
#fbc{background:#fff;border-radius:26px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:24px 22px;
  max-width:430px;width:100%;text-align:center;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
#fbi{font-size:56px;line-height:1}
#fbt{font-size:24px;font-weight:900;margin:4px 0}
#fba{font-size:30px;font-weight:800;margin:8px 0 2px}
#fbp{font-size:16px;font-weight:700;color:var(--ink2)}
#fbn{font-size:15px;color:var(--ink2);font-weight:700;margin-top:6px}
.small{font-size:14px;color:var(--ink2);font-weight:800}
.navbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:6px}
@media(max-width:560px){.tian{width:220px;height:220px}.opt.hz{font-size:44px}}
</style>
</head>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jq(s){return esc(JSON.stringify(String(s==null?'':s)));}
function clean(s){return String(s||'').replace(/[\s，。？！?!.,、；;：:"'“”‘’（）()]/g,'');}
function similar(a,b){a=clean(a);b=clean(b);if(!a||!b)return 0;if(a===b)return 1;
  let h=0;const bb=b.split('');
  for(const c of a.split('')){const i=bb.indexOf(c);if(i>=0){h++;bb.splice(i,1);}}
  return h/Math.max(a.length,b.length);}

const TTS={on:true,voice:null,ready:false,
  pick(){const vs=speechSynthesis.getVoices()||[];
    this.voice=vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/female|xiaoxiao|huihui|yaoyao|ting/i.test(v.name))
      ||vs.find(v=>/zh[-_](CN|Hans)/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;
    this.ready=!!this.voice;const w=$('#voicewarn');if(w)w.style.display=this.ready?'none':'block';},
  say(t,rate){if(!this.on||!t)return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t));
      u.lang='zh-CN';u.rate=rate||0.78;u.pitch=1.05;if(this.voice)u.voice=this.voice;
      speechSynthesis.speak(u);}catch(e){}},
  stop(){try{speechSynthesis.cancel()}catch(e){}}};
if('speechSynthesis' in window){TTS.pick();speechSynthesis.onvoiceschanged=()=>TTS.pick();setTimeout(()=>TTS.pick(),700);}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const SFX={ctx:null,on:true,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},
  beep(f,d,t,v){if(!this.on)return;this.init();if(!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=t||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(v||.15,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+d);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+d);},
  click(){this.beep(660,.06,'triangle',.09)},
  pop(){this.beep(900,.09,'square',.1)},
  good(){[784,988,1175].forEach((f,i)=>setTimeout(()=>this.beep(f,.16,'sine',.13),i*95))},
  bad(){this.beep(180,.24,'sawtooth',.1)},
  win(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.beep(f,.22,'triangle',.13),i*110))}};
function toggleSound(){TTS.on=SFX.on=!TTS.on;$('#sndb').textContent=TTS.on?'🔊':'🔇';

const CF=$('#cf');let cx=null;
function fitCF(){CF.width=innerWidth;CF.height=innerHeight;cx=CF.getContext('2d')}
fitCF();addEventListener('resize',fitCF);
function confetti(n){n=n||70;const P=[];
  const C=['#ff7fa3','#ffc93c','#4ec99b','#3d9bf0','#9d72dd','#ff9a4d'];
  for(let i=0;i<n;i++)P.push({x:Math.random()*CF.width,y:-20-Math.random()*140,
    vx:(Math.random()-.5)*2.4,vy:2.2+Math.random()*3.4,s:5+Math.random()*8,
    c:C[Math.random()*C.length|0],r:Math.random()*6});
  let f=0;(function lp(){f++;cx.clearRect(0,0,CF.width,CF.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.13;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
      cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
    if(f<150)requestAnimationFrame(lp);else cx.clearRect(0,0,CF.width,CF.height);})();}

function lessonPct(i){
  const l=LS[i],d=G.done[l.id];
  const tot=l.words.length+l.sents.length + l.sents.length + l.write.length + l.sents.length;
  const dn=Math.min(d[0],l.words.length+l.sents.length)+Math.min(d[1],l.sents.length)
          +Math.min(d[2],l.write.length)+Math.min(d[3],l.sents.length);
  return Math.round(dn/tot*100);
}

function readSelf(s){const it=$('#stage')._it;G.read++;pendingNext=nextItem;
  award(s>=3,it.hz,it.py,it.vi,s*4);}
function readRec(){
  const it=$('#stage')._it;
  if(!SR){readSelf(3);return;}
  let r;try{r=new SR();}catch(e){readSelf(3);return;}
  r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=3;
  $('#mic').classList.add('rec');$('#heard').textContent='🎙️ Đang nghe…';
  r.onresult=e=>{let best=0,txt='';
    for(let i=0;i<e.results[0].length;i++){const t=e.results[0][i].transcript,s=similar(t,it.hz);
      if(s>best){best=s;txt=t;}}
    $('#heard').innerHTML='Em đã đọc: <b>'+esc(txt)+'</b>';
    $('#sb').style.width=Math.round(best*100)+'%';
    G.read++;pendingNext=nextItem;
    const st=best>=.85?3:best>=.6?2:1;
    setTimeout(()=>award(best>=.6,it.hz,it.py,'Độ chính xác: '+Math.round(best*100)+'% — '+it.vi,st*4),450);};
  r.onerror=()=>{$('#mic').classList.remove('rec');$('#heard').textContent='Không nghe được. Tự chấm sao nhé!';};
  r.onend=()=>$('#mic').classList.remove('rec');

let PEN=null;
function tWrite(){
  const l=LS[G.L],ch=l.write[G.item];
  const info=findChar(ch);
  $('#stage').innerHTML=frame('Tô chữ','g',
    'Nhìn chữ mờ rồi dùng chuột (hoặc ngón tay) tô theo. Tô xong bấm “Chấm bài”.',
    `<div class="wwrap">
       <div class="tian" id="tian"><div class="guidech"><span>${esc(ch)}</span></div>
         <canvas id="cv"></canvas><div class="grid"></div></div>
       <div class="wmeta">

         <div class="wp py">${esc(info.py)}</div>
         <div class="wv">${esc(info.vi)}</div>
         <div class="sbar"><i id="wb"></i></div>
         <div class="small" id="wmsg">Chưa chấm</div>
         <div class="actions" style="justify-content:flex-start">
           <button class="btn b sm" onclick="SFX.init();TTS.say(${jq(ch)})">🔊 Nghe</button>
           <button class="btn ghost sm" onclick="penClear()">🧽 Xoá</button>
           <button class="btn ghost sm" onclick="penGuide()">👁️ Ẩn/hiện chữ mẫu</button>

       </div></div>
     <div class="chars">${l.write.map((c,k)=>
       `<button class="cbtn zh ${k===G.item?'on':''} ${G.wdone[l.id+c]?'done':''}" onclick="G.item=${k};renderTab()">${esc(c)}</button>`).join('')}</div>`);
  initPen(ch);
}
function findChar(ch){
  for(const w of ALLW) if(w.hz===ch) return w;
  for(const w of ALLW) if(w.hz.includes(ch)) return {py:w.py,vi:'(trong '+w.hz+' — '+w.vi+')'};
  return {py:'',vi:''};
}
function initPen(ch){
  const wrap=$('#tian'),cv=$('#cv');
  const S=520; cv.width=S; cv.height=S;
  const g=cv.getContext('2d');
  const mask=document.createElement('canvas');mask.width=S;mask.height=S;
  const mg=mask.getContext('2d');
  mg.fillStyle='#000';mg.textAlign='center';mg.textBaseline='middle';
  mg.font='400px "PingFang SC","Microsoft YaHei","Noto Sans SC","SimHei",sans-serif';
  mg.fillText(ch,S/2,S/2+14);
  const md=mg.getImageData(0,0,S,S).data;
  let maskCount=0;const M=new Uint8Array(S*S);
  for(let i=0,p=0;i<md.length;i+=4,p++){if(md[i+3]>60){M[p]=1;maskCount++;}}
  PEN={cv,g,S,M,maskCount,drawing:false};
  redrawPen();
  const pos=e=>{const r=cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return [(t.clientX-r.left)/r.width*S,(t.clientY-r.top)/r.height*S];};
  const down=e=>{e.preventDefault();PEN.drawing=true;const[x,y]=pos(e);
    PEN.g.beginPath();PEN.g.moveTo(x,y);PEN.g.lineTo(x+0.1,y);PEN.g.stroke();};
  const move=e=>{if(!PEN.drawing)return;e.preventDefault();const[x,y]=pos(e);
    PEN.g.lineTo(x,y);PEN.g.stroke();};
  const up=()=>{PEN.drawing=false;};
  cv.onmousedown=down;cv.onmousemove=move;window.onmouseup=up;
  cv.ontouchstart=down;cv.ontouchmove=move;cv.ontouchend=up;
}
function redrawPen(){
  const {g,S}=PEN;
  g.clearRect(0,0,S,S);
  g.strokeStyle='#2b2b46';g.lineWidth=26;g.lineCap='round';g.lineJoin='round';
}
function penClear(){redrawPen();
  $('#wb').style.width='0';$('#wmsg').textContent='Chưa chấm';SFX.click();}
function penGuide(){$('#tian').classList.toggle('noguide');SFX.click();}
function penScore(){
  const {g,S,M,maskCount}=PEN;
  const d=g.getImageData(0,0,S,S).data;
  let inMask=0,ink=0;
  for(let i=0,p=0;i<d.length;i+=4,p++){
    if(d[i+3]>40){                    // canvas chỉ chứa nét của học sinh
      ink++; if(M[p])inMask++;
    }
  }
  if(ink<400){$('#wmsg').textContent='Em chưa tô gì cả!';SFX.bad();return;}
  const cover=inMask/maskCount, acc=inMask/ink;
  const score=Math.max(0,Math.min(1,cover*0.65+acc*0.35));
  const stars=(cover>0.55&&acc>0.55)?3:(cover>0.35&&acc>0.4)?2:1;
  $('#wb').style.width=Math.round(score*100)+'%';
  $('#wmsg').innerHTML=`Phủ nét: <b>${Math.round(cover*100)}%</b> · Chính xác: <b>${Math.round(acc*100)}%</b> ${'⭐'.repeat(stars)}`;
  const l=LS[G.L],ch=l.write[G.item];
  if(!G.wdone[l.id+ch]){G.wdone[l.id+ch]=1;G.write++;}
  pendingNext=nextItem;
  award(stars>=2,ch,findChar(ch).py,stars>=2?'Tô đẹp lắm!':'Tô bám sát nét chữ hơn nhé!',stars*5);
}

/* ---- Tab 4: GHÉP CÂU ---- */
function splitChips(hz,words){
  const ws=words.map(w=>w.hz).filter(w=>w.length>1).sort((a,b)=>b.length-a.length);
  const out=[];let i=0;
  const s=hz.replace(/[，。？！、]/g,'');
  while(i<s.length){
    let hit=null;
    for(const w of ws) if(s.startsWith(w,i)){hit=w;break;}
    if(hit){out.push(hit);i+=hit.length;}else{out.push(s[i]);i++;}
  }
  return out;
}
function tBuild(){
  const l=LS[G.L],it=l.sents[G.item],box=$('#stage');
  if(!box._b||box._bk!==l.id+'|'+G.item){
    const chips=splitChips(it.hz,[...l.words,...ALLW]);
    box._b={bank:shuffle(chips.map((c,i)=>({c,i}))),got:[],chips};
    box._bk=l.id+'|'+G.item;
  }
  const b=box._b;
  box.innerHTML=frame('Ghép câu','o',
    'Nghe câu rồi bấm các thẻ chữ theo đúng thứ tự. Ghép xong đọc to câu đó lên!',
    `${spk(it.hz,'Nghe câu')}
     <div class="viline">${esc(it.vi)}</div>
     <div class="slot" id="slot">${b.got.length?b.got.map(x=>`<span class="chip2 zh">${esc(x.c)}</span>`).join('')
       :'<span class="small">Bấm các thẻ bên dưới theo đúng thứ tự…</span>'}</div>
     <div class="bank">${b.bank.map((x,k)=>x.used?'':`<button class="chip2 zh" onclick="bAdd(${k})">${esc(x.c)}</button>`).join('')}</div>
     <div class="actions">
       <button class="btn ghost sm" onclick="bUndo()">↩️ Bỏ thẻ cuối</button>
       <button class="btn g" onclick="bCheck()">✅ Kiểm tra</button></div>`);
  box._it=it;
}
function bAdd(k){const b=$('#stage')._b;if(!b||!b.bank[k])return;
  b.bank[k].used=true;b.got.push(b.bank[k]);SFX.click();TTS.say(b.bank[k].c);tBuild();}
function bUndo(){const b=$('#stage')._b;if(!b)return;const x=b.got.pop();if(x)x.used=false;tBuild();}
function bCheck(){
  const box=$('#stage'),b=box._b,it=box._it;
  const ok=clean(b.got.map(x=>x.c).join(''))===clean(it.hz);
  pendingNext=nextItem;award(ok,it.hz,it.py,it.vi);
}

const GAMES=[

function startGame(id){G.game=id;stopTimer();

function backGames(){G.game=null;stopTimer();rGames();}
function gFrame(title,ins,body){

function gameWin(id,msg,pts){confetti(120);G.games[id]=1;G.score+=(pts||25);hud();
  pendingNext=backGames;setTimeout(()=>award(true,'','',msg,0),500);}

function gPair(){
  const mode=G.game.split('_')[1];
  if(!window._p||window._p.mode!==mode){
    let pairs;
    if(mode==='s') pairs=shuffle(ALLS).slice(0,5).map(s=>({k:s.hz,a:s.vi,b:s.hz}));
    else pairs=shuffle(ALLW).slice(0,6).map(w=>({k:w.hz,a:(mode==='py'?w.py:w.vi),b:w.hz}));
    window._p={mode,pairs,
      cards:shuffle([...pairs.map(p=>({k:p.k,f:p.a,t:'a'})),...pairs.map(p=>({k:p.k,f:p.b,t:'b'}))]),
      open:[],found:0,total:pairs.length,moves:0};
  }
  drawPair();
}
function drawPair(){
  const g=window._p;if(!g)return;
  const cfg=GAMES.find(x=>x.id===G.game);
  $('#screen').innerHTML=gFrame(cfg.e+' '+cfg.n,cfg.d+'. Lật 2 thẻ để tìm đôi bạn!',
    `<div class="center small">Đã ghép ${g.found}/${g.total} đôi • Lượt lật: ${g.moves}</div>
     <div class="g5">${g.cards.map((c,k)=>{
       const show=c.done||g.open.includes(k);
       const cls=(g.mode==='s')?'sm zh':(c.t==='b'?'hz zh':'sm');
       return `<button class="cell ${cls} ${c.done?'gone':''}" onclick="flipPair(${k})">${show?esc(c.f):'❓'}</button>`;
     }).join('')}</div>`);
}
function flipPair(k){
  const g=window._p;if(!g)return;const c=g.cards[k];
  if(c.done||g.open.includes(k)||g.open.length>=2)return;
  SFX.click();g.open.push(k);drawPair();
  if(c.t==='b')TTS.say(c.f);
  if(g.open.length===2){
    g.moves++;const[a,b]=g.open.map(i=>g.cards[i]);
    if(a.k===b.k&&a.t!==b.t){
      a.done=b.done=true;g.found++;g.open=[];G.score+=6;SFX.good();hud();
      setTimeout(drawPair,240);
      if(g.found>=g.total){const id=G.game;window._p=null;gameWin(id,'Ghép đúng hết! Lượt lật: '+g.moves);}
    }else{SFX.bad();setTimeout(()=>{g.open=[];drawPair();},760);}
  }
}

function popBal(i,hz){

function drawLadder(){
  const g=window._l;if(!g)return;
  const it=g.pool[g.step%g.pool.length];
  const ds=shuffle(ALLS.filter(s=>s.vi!==it.vi)).slice(0,2);
  g.cur=it;g.opts=shuffle([{v:it.vi,ok:1},...ds.map(d=>({v:d.vi,ok:0}))]);

    `<div class="ladder">${Array.from({length:g.total},(_,i)=>
       `<div class="step ${i<g.step?'done':''} ${i===g.step?'on':''}">${i===g.step?'🐼 ':''}Bậc ${i+1}${i===g.total-1?' 🏁':''}</div>`).join('')}</div>

function ladPick(k){
  const g=window._l;if(!g)return;
  if(g.opts[k].ok){g.step++;G.score+=8;SFX.good();TTS.say(g.cur.hz);hud();
    if(g.step>=g.total){window._l=null;gameWin('ladder','Gấu trúc đã leo tới đỉnh thang!');return;}
  }else{SFX.bad();if(g.step>0)g.step--;}

function gBuild(){
  if(!window._bd)window._bd={i:0,ok:0,total:4,pool:shuffle(ALLS)};
  drawGBuild();
}
function drawGBuild(){
  const g=window._bd;if(!g)return;
  const it=g.pool[g.i];
  if(!g.bank){const chips=splitChips(it.hz,ALLW);
    g.bank=shuffle(chips.map((c,i)=>({c,i})));g.got=[];}
  $('#screen').innerHTML=gFrame('🧱 Ghép câu tốc độ',
    'Nghe câu rồi xếp thẻ chữ thành câu đúng.',
    `<div class="center small">Câu ${g.i+1}/${g.total} • Đúng: ${g.ok}</div>
     ${spk(it.hz,'Nghe câu')}
     <div class="viline">${esc(it.vi)}</div>
     <div class="slot">${g.got.length?g.got.map(x=>`<span class="chip2 zh">${esc(x.c)}</span>`).join('')
        :'<span class="small">Bấm thẻ theo đúng thứ tự…</span>'}</div>
     <div class="bank">${g.bank.map((x,k)=>x.used?'':`<button class="chip2 zh" onclick="gbAdd(${k})">${esc(x.c)}</button>`).join('')}</div>
     <div class="actions">
       <button class="btn ghost sm" onclick="gbUndo()">↩️ Bỏ thẻ cuối</button>
       <button class="btn g" onclick="gbCheck()">✅ Kiểm tra</button></div>`);
}
function gbAdd(k){const g=window._bd;if(!g||!g.bank[k])return;
  g.bank[k].used=true;g.got.push(g.bank[k]);SFX.click();TTS.say(g.bank[k].c);drawGBuild();}
function gbUndo(){const g=window._bd;if(!g)return;const x=g.got.pop();if(x)x.used=false;drawGBuild();}
function gbCheck(){
  const g=window._bd;if(!g)return;
  const it=g.pool[g.i];
  const ok=clean(g.got.map(x=>x.c).join(''))===clean(it.hz);
  if(ok)g.ok++;SFX[ok?'good':'bad']();TTS.say(it.hz);
  setTimeout(()=>{
    if(!window._bd)return;
    g.i++;g.bank=null;g.got=[];
    if(g.i>=g.total){const good=g.ok;window._bd=null;
      if(good>=3)gameWin('build','Ghép đúng '+good+'/4 câu!');
      else{pendingNext=backGames;award(false,it.hz,it.py,'Đúng '+good+'/4. Thử lại nhé!',0);}}
    else drawGBuild();},900);
}
function gSpeed(){
  if(!window._s)window._s={t:60,hit:0,miss:0,started:false};
  const g=window._s;
  if(!g.started){$('#screen').innerHTML=gFrame('⚡ Thử thách 60 giây',
    'Nghe từ rồi bấm đúng chữ Hán. 60 giây — càng nhiều càng tốt!',
    `<div class="center"><div style="font-size:78px">⚡</div>
     <button class="btn p" onclick="spGo()">🚀 Bắt đầu</button></div>`);return;}
  drawSp();
}
function spGo(){const g=window._s;if(!g)return;g.started=true;SFX.init();stopTimer();
  TIMER=setInterval(()=>{g.t--;const e=$('#gt');if(e)e.textContent='⏱️ '+g.t+'s';
    if(g.t<=0)spEnd();},1000);drawSp();}
function drawSp(){
  const g=window._s;if(!g)return;
  const t=shuffle(ALLW)[0];
  const os=shuffle(ALLW.filter(w=>w.hz!==t.hz)).slice(0,3);
  g.cur=t;
  $('#screen').innerHTML=gFrame('⚡ Thử thách 60 giây','Nghe rồi bấm đúng chữ thật nhanh!',
    `<div class="gtimer" id="gt">⏱️ ${g.t}s</div>
     <div class="center small">✅ ${g.hit} • ❌ ${g.miss}</div>
     ${spk(t.hz,'Nghe lại')}
     <div class="opts c2">${shuffle([t,...os]).map(o=>
       `<button class="opt hz zh" onclick="spPick(${jq(o.hz)})">${esc(o.hz)}</button>`).join('')}</div>`);
  setTimeout(()=>TTS.say(t.hz),240);
}
function spPick(hz){const g=window._s;if(!g||!g.cur)return;
  if(hz===g.cur.hz){g.hit++;G.score+=5;SFX.good();}else{g.miss++;SFX.bad();}
  hud();if(g.t>0)drawSp();}
function spEnd(){stopTimer();const g=window._s;if(!g)return;
  const hit=g.hit;window._s=null;
  if(hit>=10)gameWin('speed','Đúng '+hit+' từ trong 60 giây!');
  else{pendingNext=backGames;award(false,'','','Đúng '+hit+' từ. Thử lại nhé!',0);}}

/* ============ NGHE – NÓI ============ */
const STABS=[{n:'🖼️ Miêu tả tranh'},{n:'📖 Kể chuyện'},{n:'💬 Tình huống'}];
function rSpeak(){
  $('#screen').innerHTML=`
    <div class="hero" style="padding:6px 4px 8px">
      <h1 style="font-size:clamp(19px,3.8vw,27px);margin:2px 0">🗣️ Nghe – Nói</h1>
      <p class="small">Miêu tả tranh · Kể chuyện · Xử lý tình huống</p></div>
    <div id="tabs">${STABS.map((t,j)=>`<button class="tab ${j===G.tab?'on':''}" onclick="G.tab=${j};G.item=0;rSpeak()">${t.n}</button>`).join('')}</div>
    <div id="stage"></div>
    <div class="navbar">
      <button class="btn ghost sm" onclick="spkPrev()">◀️ Trước</button>
      <span class="small" id="cnt2"></span>
      <button class="btn ghost sm" onclick="spkNext()">Sau ▶️</button></div>`;
  renderSpeak();
}
function spkLen(){return [PICS.length,STORIES.length,SITS.length][G.tab];}
function spkNext(){if(G.item<spkLen()-1){G.item++;renderSpeak();}else{SFX.win();confetti(90);G.item=0;renderSpeak();}}
function spkPrev(){if(G.item>0){G.item--;renderSpeak();}}
function renderSpeak(){
  const c=$('#cnt2');if(c)c.textContent=`${STABS[G.tab].n} • ${G.item+1}/${spkLen()}`;
  [sPic,sStory,sSit][G.tab]();
}
function micBlock(target){
  return `<button class="mic" id="mic" onclick="spkRec(${jq(target)})">🎤</button>
    <div class="heard zh" id="heard">${SR?'Bấm micro rồi nói to nhé!':'Máy chưa hỗ trợ micro — nói to rồi tự chấm.'}</div>
    <div class="sbar"><i id="sb"></i></div>`;
}
function spkRec(target){
  if(!SR){G.score+=10;hud();SFX.good();$('#heard').textContent='Máy không nghe được — cô/mẹ chấm giúp nhé!';return;}
  let r;try{r=new SR();}catch(e){return;}
  r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=3;
  $('#mic').classList.add('rec');$('#heard').textContent='🎙️ Đang nghe…';
  r.onresult=e=>{
    const txt=e.results[0][0].transcript;
    const s=similar(txt,target);
    $('#heard').innerHTML='Em đã nói: <b>'+esc(txt)+'</b>';
    $('#sb').style.width=Math.round(Math.min(1,s*1.3)*100)+'%';
    G.score+=Math.round(s*15);hud();SFX[s>=.4?'good':'click']();};
  r.onerror=()=>{$('#mic').classList.remove('rec');$('#heard').textContent='Không nghe được, thử lại nhé!';};
  r.onend=()=>$('#mic').classList.remove('rec');
  try{r.start()}catch(e){$('#mic').classList.remove('rec')}
}
function sPic(){
  const p=PICS[G.item];
  $('#stage').innerHTML=frame('Miêu tả tranh','b',
    'Nhìn tranh và nói ít nhất 3 câu tiếng Trung. Bấm 🎤 để máy nghe em nói.',
    `<img class="panelimg" src="${IMGS[p.img]}" onclick="this.classList.toggle('zoom')">
     <div class="sit" style="font-size:17px">${esc(p.task)}</div>
     ${micBlock(p.model.join(''))}
     <div class="actions">
       <button class="btn ghost sm" onclick="toggleHint(${G.item})">💡 Gợi ý mẫu câu</button>
       <button class="btn b sm" onclick="SFX.init();sayAll(${jq(p.model.join('|'))})">🔊 Nghe mẫu</button></div>
     <div id="hint" style="display:none;margin-top:12px">
       ${p.model.map(m=>`<div class="srowlike" style="background:#f7fbff;border-radius:14px;padding:10px;margin-bottom:8px">
         <span class="zh" style="font-size:22px;font-weight:800">${esc(m)}</span>
         <button class="btn ghost sm" style="float:right" onclick="TTS.say(${jq(m)})">🔊</button></div>`).join('')}</div>`);
}
function toggleHint(){const h=$('#hint');h.style.display=h.style.display==='none'?'block':'none';SFX.click();}
function sayAll(joined){let d=0;joined.split('|').forEach(s=>{setTimeout(()=>TTS.say(s),d);d+=500+s.length*380;});}
function sStory(){
  const s=STORIES[G.item];
  $('#stage').innerHTML=frame('Kể chuyện','g',
    'Nhìn dãy tranh và kể lại câu chuyện bằng tiếng Trung, mỗi tranh một câu.',
    `<div class="center" style="font-size:46px;letter-spacing:8px">${s.emo}</div>
     <div class="sit" style="font-size:17px">${esc(s.task)}</div>
     ${micBlock(s.lines.join(''))}
     <div class="actions">
       <button class="btn ghost sm" onclick="toggleHint()">💡 Gợi ý câu chuyện</button>
       <button class="btn b sm" onclick="SFX.init();sayAll(${jq(s.lines.join('|'))})">🔊 Nghe cả chuyện</button></div>
     <div id="hint" style="display:none;margin-top:12px">
       ${s.lines.map((m,i)=>`<div style="background:#f7fbff;border-radius:14px;padding:10px;margin-bottom:8px">
         <b>${i+1}.</b> <span class="zh" style="font-size:22px;font-weight:800">${esc(m)}</span>
         <button class="btn ghost sm" style="float:right" onclick="TTS.say(${jq(m)})">🔊</button></div>`).join('')}</div>`);
}
function sSit(){
  const it=SITS[G.item],box=$('#stage');
  if(!box._q||box._qk!==G.item){
    const ds=shuffle(ALLS.filter(s=>s.hz!==it.a)).slice(0,3);
    box._q=shuffle([{h:it.a,p:it.py,ok:1},...ds.map(d=>({h:d.hz,p:d.py,ok:0}))]);
    box._qk=G.item;
  }
  box.innerHTML=frame('Tình huống','o',
    'Đọc tình huống, chọn câu đúng rồi NÓI TO câu đó lên.',
    `<div class="sit"><span class="em">${it.em}</span>${esc(it.sit)}</div>
     <div class="opts c1">${box._q.map((o,k)=>
       `<button class="opt sm zh" id="o${k}" onclick="pickSit(${k})">${esc(o.h)}
         <span class="sub py">${esc(o.p)}</span></button>`).join('')}</div>
     ${micBlock(it.a)}`);
  box._it=it;
}
function pickSit(k){
  const box=$('#stage'),it=box._it,ok=box._q[k].ok===1;
  $$('.opt').forEach(b=>b.style.pointerEvents='none');
  $('#o'+k).classList.add(ok?'ok':'no');
  if(!ok)$('#o'+box._q.findIndex(o=>o.ok===1)).classList.add('ok');
  pendingNext=null;award(ok,it.a,it.py,'Bây giờ hãy NÓI TO câu này rồi bấm 🎤 nhé!');
}
document.addEventListener('click',()=>SFX.init(),{once:true});
render();
</script>
</body>
</html>
